spring.application.name=auth_gateway
server.port=9000

# ===============================
# OAuth2 Resource Server (JWT)
# ===============================
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9001/oauth2/jwks

# ===============================
# Redis (Rate Limiting)
# ===============================
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ===============================
# Gateway Configuration
# ===============================
spring.cloud.gateway.discovery.locator.enabled=false

# Auth service URL
auth.service.url=http://localhost:9001

# Circuit Breaker Configuration
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=5s
resilience4j.circuitbreaker.configs.default.sliding-window-size=10

# Rate Limiting Configuration
spring.cloud.gateway.filter.ratelimit.redis.replenish-rate=100
spring.cloud.gateway.filter.ratelimit.redis.burst-capacity=200

# ===============================
# Logging
# ===============================
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG

# Gateway routing logs
logging.level.org.springframework.cloud.gateway=DEBUG

# Netty client (actual HTTP calls)
logging.level.reactor.netty.http.client=DEBUG

# ===============================
# Management Endpoints
# ===============================
management.endpoints.web.exposure.include=health,info,metrics,gateway
management.endpoint.health.show-details=when-authorized
