spring.application.name=auth_service_fraud
server.port=9001

# ===============================
# Datasource
# ===============================
spring.datasource.url=jdbc:postgresql://localhost:5432/fraud_detection?autoReconnect=true
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.PostgreSQLDialect

# ===============================
# OAuth2 Authorization Server
# ===============================
spring.security.oauth2.authorizationserver.issuer=http://localhost:9001

# ===============================
# Fraud Client Configuration
# ===============================
fraud.oauth.client-id=fraud-client
fraud.oauth.client-secret=fraud-secret

# ===============================
# Logging (useful during dev)
# ===============================
logging.level.root=INFO
logging.level.org.springframework.security=DEBUG
logging.level.com.api.authservice.auth_service_fraud=DEBUG

# ===============================
# Management Endpoints
# ===============================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized
